<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t" class="c" style="--bx:0px;--by:0px;--bs:1;--rise:470px;--up:0px;--ink:#E6E1D6;--fin:#E0694C;--ok:#7FC29F" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">4th Try Tech animated logo, compact (dark)</title><style>
.node,.retry path,.tobadge,.sun,.stripes,.rise,.flame,.words{transform-box:fill-box;transform-origin:center}
.node{animation:fadein .4s both}
.fail{animation:fadein .4s both,flash .5s var(--d) both,dim .4s calc(var(--d) + .5s) forwards,fadeout .4s 3.6s forwards}
.win{animation:fadein .4s both,win .01s var(--d) forwards,pop .45s var(--d) both}
.retry{opacity:0;animation:blink .7s var(--d) both}
.retry path{animation:turn .7s var(--d) both}
.dot{animation:travel 3.2s .4s both}
.trail{stroke-dasharray:100;animation:draw .55s var(--d) both ease-in-out,fadeout .45s calc(var(--d) + .75s) forwards}
.tobadge{animation:tobadge .6s 3.7s both cubic-bezier(.5,0,.2,1)}
.sun{animation:grow .55s 3.6s both cubic-bezier(.3,1.3,.5,1)}
.stripes{animation:wipe .45s 4s both ease-out}
.rise{animation:rise .75s 4.05s both cubic-bezier(.2,1.25,.4,1)}
.flame{transform-origin:50% 0;animation:burn .9s 4.05s both ease-out}
.ring{stroke-dasharray:100;animation:draw .6s 4.7s both ease-in-out}
.icons{animation:fadein .6s 4.5s both}
.words{animation:fadeup .6s 4.7s both ease-out}
.tagline{animation-delay:4.9s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes fadeup{from{opacity:0;transform:translateY(var(--up))}to{opacity:1;transform:translateY(0)}}
@keyframes dim{to{opacity:.28}}
@keyframes flash{0%,100%{stroke:var(--ink)}30%,70%{stroke:var(--fin)}}
@keyframes win{to{stroke:var(--ok)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes blink{0%,100%{opacity:0}15%,80%{opacity:1}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes travel{0%{offset-distance:0%;opacity:0;animation-timing-function:ease-in-out}3%{opacity:1}17%,25%{offset-distance:25%;animation-timing-function:ease-in-out}42%,50%{offset-distance:50%;animation-timing-function:ease-in-out}67%,75%{offset-distance:75%;animation-timing-function:ease-in-out}92%{offset-distance:100%;opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes tobadge{to{transform:translate(var(--bx),var(--by)) scale(var(--bs))}}
@keyframes grow{0%{transform:scale(.001);opacity:0}4%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes wipe{0%{transform:scaleX(.001);opacity:0}4%{opacity:1}100%{transform:scaleX(1);opacity:1}}
@keyframes rise{from{transform:translateY(var(--rise))}to{transform:translateY(0)}}
@keyframes burn{0%{transform:scaleY(.2)}40%{transform:scaleY(1.25)}100%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dot,.fail,.trail,.retry{opacity:0}.tobadge{transform:translate(var(--bx),var(--by)) scale(var(--bs))}.win{stroke:var(--ok)}}
/* compact version: the rocket itself tries three times, inside the roundel */
.c .sun{animation:grow .5s 0s both cubic-bezier(.3,1.3,.5,1)}
.c .stripes{animation:wipe .4s .3s both ease-out}
.c .rise{animation:hulltries 4.3s .5s both,fadein .3s .25s both}
.c .flame{animation:sputter 4.3s .5s both}
.c .ring{animation:draw .6s 4.5s both ease-in-out}
.c .n{opacity:0}
.c .n4{transform-box:fill-box;transform-origin:center}
.c .n1{animation:show 1.1s .5s both}.c .n2{animation:show 1.1s 1.6s both}.c .n3{animation:show 1.1s 2.7s both}
.c .n4{animation:fadein .2s 3.8s both,pop .45s 3.8s both}
.c .bring{animation:win .01s 3.8s forwards}
@keyframes hulltries{0%{transform:translateY(70px)}8%{transform:translateY(38px)}14%,26%{transform:translateY(70px)}34%{transform:translateY(30px)}40%,52%{transform:translateY(70px)}60%{transform:translateY(22px)}66%,78%{transform:translateY(70px);animation-timing-function:cubic-bezier(.2,1.25,.4,1)}100%{transform:translateY(0)}}
@keyframes sputter{0%{transform:scaleY(0)}8%{transform:scaleY(.8)}14%,26%{transform:scaleY(0)}34%{transform:scaleY(.9)}40%,52%{transform:scaleY(0)}60%{transform:scaleY(1)}66%,78%{transform:scaleY(0)}90%,100%{transform:scaleY(1)}}
@keyframes show{0%{opacity:0}10%,90%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.c .n4{opacity:1}.c .bring{stroke:var(--ok)}}
</style><defs><clipPath id="dc"><circle cx="256" cy="256" r="232"/></clipPath><clipPath id="bc"><path d="M200 38 C244 92 254 170 246 258 C243 298 234 322 226 332 H174 C166 322 157 298 154 258 C146 170 156 92 200 38 Z"/></clipPath></defs><circle class="sun" id="disc" cx="256" cy="256" r="232" fill="#E8C07D"/><g clip-path="url(#dc)"><g class="stripes" id="stripes"><rect x="0" y="300" width="512" height="18" fill="#F08A6C"/><rect x="0" y="318" width="512" height="18" fill="#E0694C"/><rect x="0" y="336" width="512" height="18" fill="#7E9CBC"/></g><g class="rise" id="rocket"><g transform="translate(256 268) scale(1.02) translate(-200 -242)"><g fill="#E8C07D" stroke="#E8C07D" stroke-width="14" stroke-linejoin="round"><path d="M200 38 C244 92 254 170 246 258 C243 298 234 322 226 332 H174 C166 322 157 298 154 258 C146 170 156 92 200 38 Z"/><path d="M160 232 C118 256 100 310 104 368 C118 342 138 330 164 322 Z"/><path d="M240 232 C282 256 300 310 296 368 C282 342 262 330 236 322 Z"/><path d="M176 330 H224 L229 346 H171 Z"/><path d="M176 346 C166 388 188 412 200 446 C212 412 234 388 224 346 Z"/></g><g class="flame" id="flame"><path d="M176 346 C166 388 188 412 200 446 C212 412 234 388 224 346 Z" fill="#F08A6C"/><path d="M189 346 C185 372 195 388 200 408 C205 388 215 372 211 346 Z" fill="#E8C07D"/></g><g id="fins"><path d="M160 232 C118 256 100 310 104 368 C118 342 138 330 164 322 Z" fill="#E0694C"/><path d="M240 232 C282 256 300 310 296 368 C282 342 262 330 236 322 Z" fill="#E0694C"/></g><path d="M176 330 H224 L229 346 H171 Z" fill="#3D4558"/><path id="body" d="M200 38 C244 92 254 170 246 258 C243 298 234 322 226 332 H174 C166 322 157 298 154 258 C146 170 156 92 200 38 Z" fill="#7E9CBC"/><g clip-path="url(#bc)"><rect x="200" y="0" width="70" height="340" fill="#000" opacity=".16"/><rect x="140" y="110" width="120" height="9" fill="#E8C07D"/><rect x="140" y="296" width="120" height="7" fill="#E8C07D"/></g><path d="M197 252 H203 L205 352 H195 Z" fill="#F08A6C"/><g id="badge"><circle class="bring" cx="200" cy="205" r="35" fill="#1F2430" stroke="#F08A6C" stroke-width="6"/><g transform="translate(200 205)"><path class="n n1" d="M-5 -9 L2 -15 V15" fill="none" stroke="#F08A6C" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(.92)"/><path class="n n2" d="M-8 -8 C-8 -19 9 -19 8 -7 C8 1 -8 5 -8 15 H9" fill="none" stroke="#F08A6C" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(.92)"/><path class="n n3" d="M-8 -12 C-3 -18 9 -16 8 -8 C8 -2 2 0 -2 0 C4 0 10 3 9 9 C8 17 -3 19 -9 12" fill="none" stroke="#F08A6C" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(.92)"/></g><path class="n n4" d="M207 225 V185 L185 213 H216" fill="none" stroke="#7FC29F" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></g><g transform="rotate(-90 256 256)"><circle class="ring" id="ring" cx="256" cy="256" r="240" fill="none" stroke="#7E9CBC" stroke-width="16" pathLength="100"/></g></svg>