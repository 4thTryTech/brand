roke-linejoin="round"/></g></g><g transform="translate(308 262)"><g class="node fail" style="--d:2.55s" stroke="#3D405B"><circle r="30" fill="#F0E9DC" stroke-width="3.5"/><path d="M-8 -12 C-3 -18 9 -16 8 -8 C8 -2 2 0 -2 0 C4 0 10 3 9 9 C8 17 -3 19 -9 12" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.714)"/></g><g class="retry" style="--d:2.55s" transform="scale(1.154)"><path d="M0 -36 A36 36 0 1 1 -31 -18 M-40 -24 L-31 -18 L-27 -29" fill="none" stroke="#E07A5F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(412 262)"><g class="tobadge" id="badge"><g class="node win" style="--d:3.3500000000000005s" stroke="#3D405B"><circle r="30" fill="#F0E9DC" stroke-width="5.14"/><path d="M7 20 V-20 L-15 8 H16" fill="none" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.8571)"/></g></g></g><circle class="dot" r="8.1" fill="#C44E33" style="offset-path:path('M-4 232 Q48.0 151.92000000000002 100 232 Q152.0 151.92000000000002 204 232 Q256.0 151.92000000000002 308 232 Q360.0 151.92000000000002 412 232')"/></g></svg>