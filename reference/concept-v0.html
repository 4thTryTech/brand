<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>4th Try Tech — Logo Concept</title>
<style>
  body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: monospace; }
  h3 { color: #555; font-size: 12px; letter-spacing: 3px; margin-bottom: 12px; }
  .card { background: #0f0f0f; border-radius: 16px; padding: 48px 64px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .variants { display: flex; gap: 48px; flex-wrap: wrap; justify-content: center; }
  .variant-label { color: #444; font-size: 11px; letter-spacing: 2px; text-align: center; margin-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <h3>4TH TRY TECH — LOGO CONCEPTS</h3>

  <div class="variants">

    <!-- DARK VERSION -->
    <div>
      <svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Node connectors -->
        <line x1="116" y1="120" x2="154" y2="120" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line x1="206" y1="120" x2="244" y2="120" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line x1="296" y1="120" x2="334" y2="120" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3"/>

        <!-- Bouncing path: dips to node level at each node, peaks between, then shoots up at node 4 -->
        <path d="
          M 50 120
          C 65 120, 70 60, 85 60
          C 100 60, 105 120, 120 120
          C 135 120, 140 60, 175 60
          C 196 60, 206 120, 210 120
          C 230 120, 235 60, 265 60
          C 285 60, 294 120, 300 120
          C 316 120, 322 60, 355 60
          C 368 60, 375 120, 385 120
          Q 390 120, 410 30
        " fill="none" stroke="#c0c0c0" stroke-width="2" stroke-linecap="round"/>

        <!-- NODE 1 — retry -->
        <circle cx="85" cy="120" r="28" fill="none" stroke="#666" stroke-width="2"/>
        <!-- retry arc -->
        <path d="M 76 115 A 10 10 0 1 1 93 128" fill="none" stroke="#666" stroke-width="2.2" stroke-linecap="round"/>
        <!-- retry arrowhead -->
        <polygon points="93,128 87,135 99,135" fill="#666" transform="rotate(-10, 93, 128)"/>

        <!-- NODE 2 — retry -->
        <circle cx="175" cy="120" r="28" fill="none" stroke="#666" stroke-width="2"/>
        <path d="M 166 115 A 10 10 0 1 1 183 128" fill="none" stroke="#666" stroke-width="2.2" stroke-linecap="round"/>
        <polygon points="183,128 177,135 189,135" fill="#666" transform="rotate(-10, 183, 128)"/>

        <!-- NODE 3 — retry -->
        <circle cx="265" cy="120" r="28" fill="none" stroke="#666" stroke-width="2"/>
        <path d="M 256 115 A 10 10 0 1 1 273 128" fill="none" stroke="#666" stroke-width="2.2" stroke-linecap="round"/>
        <polygon points="273,128 267,135 279,135" fill="#666" transform="rotate(-10, 273, 128)"/>

        <!-- NODE 4 — success -->
        <circle cx="385" cy="120" r="30" fill="none" stroke="#5ef09a" stroke-width="2.5"/>
        <!-- checkmark -->
        <polyline points="372,120 382,132 400,108" fill="none" stroke="#5ef09a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- ROCKET — tip upper-right, launching from end of bounce path ~(410,30) -->
        <g transform="translate(416, 24) rotate(40)">
          <!-- body -->
          <rect x="-6" y="-12" width="12" height="22" rx="6" fill="#d0d0d0"/>
          <!-- nose -->
          <polygon points="0,-20 -6,-12 6,-12" fill="#d0d0d0"/>
          <!-- fin left -->
          <polygon points="-6,8 -12,18 -2,12" fill="#999"/>
          <!-- fin right -->
          <polygon points="6,8 12,18 2,12" fill="#999"/>
          <!-- flame -->
          <ellipse cx="0" cy="18" rx="4" ry="6" fill="#5ef09a" opacity="0.9"/>
          <ellipse cx="0" cy="21" rx="2" ry="3" fill="white" opacity="0.5"/>
        </g>

        <!-- Try labels -->
        <text x="85" y="164" text-anchor="middle" fill="#444" font-size="9" font-family="monospace" letter-spacing="1.5">TRY 1</text>
        <text x="175" y="164" text-anchor="middle" fill="#444" font-size="9" font-family="monospace" letter-spacing="1.5">TRY 2</text>
        <text x="265" y="164" text-anchor="middle" fill="#444" font-size="9" font-family="monospace" letter-spacing="1.5">TRY 3</text>
        <text x="385" y="164" text-anchor="middle" fill="#5ef09a" font-size="9" font-family="monospace" letter-spacing="1.5">TRY 4</text>

        <!-- Brand name -->
        <text x="240" y="190" text-anchor="middle" fill="#d0d0d0" font-size="16" font-family="monospace" font-weight="bold" letter-spacing="5">4TH TRY TECH</text>
      </svg>
      <div class="variant-label">DARK / 2-COLOR</div>
    </div>

    <!-- MONO / LIGHT VERSION -->
    <div>
      <svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" style="background:white; border-radius:8px; padding:0;">
        <rect width="480" height="200" fill="white"/>
        <!-- Node connectors -->
        <line x1="116" y1="120" x2="154" y2="120" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line x1="206" y1="120" x2="244" y2="120" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line x1="296" y1="120" x2="334" y2="120" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4 3"/>

        <!-- Bouncing path -->
        <path d="
          M 50 120
          C 65 120, 70 60, 85 60
          C 100 60, 105 120, 120 120
          C 135 120, 140 60, 175 60
          C 196 60, 206 120, 210 120
          C 230 120, 235 60, 265 60
          C 285 60, 294 120, 300 120
          C 316 120, 322 60, 355 60
          C 368 60, 375 120, 385 120
          Q 390 120, 410 30
        " fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>

        <!-- NODE 1 -->
        <circle cx="85" cy="120" r="28" fill="none" stroke="#aaa" stroke-width="2"/>
        <path d="M 76 115 A 10 10 0 1 1 93 128" fill="none" stroke="#aaa" stroke-width="2.2" stroke-linecap="round"/>
        <polygon points="93,128 87,135 99,135" fill="#aaa" transform="rotate(-10, 93, 128)"/>

        <!-- NODE 2 -->
        <circle cx="175" cy="120" r="28" fill="none" stroke="#aaa" stroke-width="2"/>
        <path d="M 166 115 A 10 10 0 1 1 183 128" fill="none" stroke="#aaa" stroke-width="2.2" stroke-linecap="round"/>
        <polygon points="183,128 177,135 189,135" fill="#aaa" transform="rotate(-10, 183, 128)"/>

        <!-- NODE 3 -->
        <circle cx="265" cy="120" r="28" fill="none" stroke="#aaa" stroke-width="2"/>
        <path d="M 256 115 A 10 10 0 1 1 273 128" fill="none" stroke="#aaa" stroke-width="2.2" stroke-linecap="round"/>
        <polygon points="273,128 267,135 279,135" fill="#aaa" transform="rotate(-10, 273, 128)"/>

        <!-- NODE 4 -->
        <circle cx="385" cy="120" r="30" fill="none" stroke="#222" stroke-width="2.5"/>
        <polyline points="372,120 382,132 400,108" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- ROCKET -->
        <g transform="translate(416, 24) rotate(40)">
          <rect x="-6" y="-12" width="12" height="22" rx="6" fill="#222"/>
          <polygon points="0,-20 -6,-12 6,-12" fill="#222"/>
          <polygon points="-6,8 -12,18 -2,12" fill="#555"/>
          <polygon points="6,8 12,18 2,12" fill="#555"/>
          <ellipse cx="0" cy="18" rx="4" ry="6" fill="#555" opacity="0.8"/>
        </g>

        <!-- Try labels -->
        <text x="85" y="164" text-anchor="middle" fill="#bbb" font-size="9" font-family="monospace" letter-spacing="1.5">TRY 1</text>
        <text x="175" y="164" text-anchor="middle" fill="#bbb" font-size="9" font-family="monospace" letter-spacing="1.5">TRY 2</text>
        <text x="265" y="164" text-anchor="middle" fill="#bbb" font-size="9" font-family="monospace" letter-spacing="1.5">TRY 3</text>
        <text x="385" y="164" text-anchor="middle" fill="#222" font-size="9" font-family="monospace" letter-spacing="1.5">TRY 4</text>

        <!-- Brand name -->
        <text x="240" y="190" text-anchor="middle" fill="#111" font-size="16" font-family="monospace" font-weight="bold" letter-spacing="5">4TH TRY TECH</text>
      </svg>
      <div class="variant-label">LIGHT / MONO</div>
    </div>

  </div>
</div>
</body>
</html>
